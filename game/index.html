<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b0e1a">
<meta name="description" content="Kota Neon — an original 2D top-down open-world crime game. Drive cars and motorcycles, burn nitro, dash from the police, run taxi and VIP fares, watch the fuel gauge, dodge roadblocks, and finish twelve story missions from dawn to night.">
<title>Kota Neon — Open-World Crime Game: Nitro, Dash, Motor, Taksi, Bensin &amp; Roadblock</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1c2438; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Kota Neon: an open-world crime game. Walk and drive around the city, ride motorcycles, burn nitro, dash from the police, run taxi and VIP fares, watch the fuel gauge, dodge roadblocks, and finish twelve story missions from dawn to night"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<noscript><p style="color:#f5efe0;font-family:system-ui,sans-serif;padding:2rem">Kota Neon butuh JavaScript: nyalakan JavaScript di browser untuk bermain.</p></noscript>
<script type="module" src="./src/main.js"></script>
</body>
</html>
